<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RedPup — Page not found</title>
<meta name="robots" content="noindex">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Fredoka',system-ui,sans-serif;background:#fff4e8;color:#2a1215;text-align:center}
  .card{background:#fff;border:2px solid #f3dccb;border-radius:20px;padding:30px 36px;box-shadow:0 8px 0 rgba(42,18,21,.1);max-width:420px}
  a{display:inline-block;margin-top:14px;background:#e63940;color:#fff;text-decoration:none;font-weight:700;padding:12px 24px;border-radius:12px;box-shadow:0 4px 0 #2a1215}
  #pg{visibility:hidden}
</style></head>
<body><div class="card" id="pg"><div style="font-size:64px">🐶❓</div><h1>Page not found</h1><p>This page doesn't exist.</p><a id="home" href="/">Go to RedPup</a></div>
<script>
(async()=>{
  const base=location.pathname.startsWith("/redpup/")?"/redpup/":"/";
  document.getElementById("home").href=base;
  const path=decodeURIComponent(location.pathname.slice(base.length)).replace(/\/+/g,"/").replace(/^\/|\/$/g,"").toLowerCase();
  let h="";
  try{ const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(path));
    h=[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join(""); }catch(e){}
  if(h==="3fb773dc082a99772273b2d643c2ce4868896721bbbfe9c9b39d896da23b2919"){ try{ sessionStorage.setItem("redpup_test_go","1"); }catch(e){} location.replace(base); return; }
  if(h==="e527e3189b6142c3473b4be0632da8470768d37c4529c009580f2d115f8d1a84"){ try{ sessionStorage.setItem("redpup_anytime","1"); }catch(e){} location.replace(base); return; }
  document.getElementById("pg").style.visibility="visible";
})();
</script></body></html>
