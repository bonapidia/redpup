<style>
  :root{--red:#e63940;--dark:#b31f2a;--cream:#fff4e8;--ink:#2a1215;--gold:#ffb703;--line:#f3dccb}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Fredoka',system-ui,sans-serif;background:var(--cream);min-height:100vh;color:var(--ink);
    background-image:radial-gradient(circle at 8% 20%,#ffd6d9 0 90px,transparent 91px),radial-gradient(circle at 95% 70%,#ffe9b8 0 120px,transparent 121px),radial-gradient(circle at 70% 5%,#d7f3ee 0 70px,transparent 71px);background-attachment:fixed}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;background:var(--ink);position:sticky;top:0;z-index:5}
  .logo{cursor:pointer;display:flex}.logo img{height:40px;display:block}
  nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  body.out nav,body.out .right{visibility:hidden}
  .right{display:flex;align-items:center;gap:8px}
  .tokens{background:var(--cream);padding:7px 14px;border-radius:999px;font-weight:700;box-shadow:0 3px 0 var(--dark)}
  .user{color:#fff;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
  header nav{flex:1;flex-wrap:nowrap}
  header nav button{font-size:14px;padding:6px 9px;white-space:nowrap}
  @media(max-width:1100px){header nav{flex-wrap:wrap}}
  .tokens{white-space:nowrap}
  #testbar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:35;background:#facc15;color:#2a1215;border:3px solid #2a1215;border-radius:14px;padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.3);font-size:14px;max-width:96vw}
  #testbar button{font:inherit;font-weight:600;border:2px solid #2a1215;background:#fff;border-radius:9px;padding:4px 9px;cursor:pointer}
  .sndbtn{background:none;border:none;font-size:22px;cursor:pointer;padding:2px 4px}
  .user button.acct{color:#fff;border:none;font-size:15px;font-weight:600;padding:3px 6px}
  .user button.acct:hover{background:rgba(255,255,255,.12)}
  .user button{font:inherit;font-size:13px;background:transparent;color:#ffb3b8;border:1px solid #ffb3b8;border-radius:8px;padding:3px 8px;cursor:pointer}
  nav button,.btn{font-family:inherit;font-size:17px;font-weight:600;border:2px solid var(--red);border-radius:12px;padding:9px 16px;cursor:pointer;background:#fff;color:var(--red);box-shadow:0 4px 0 var(--dark);transition:transform .1s,box-shadow .1s}
  nav button:hover,.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--dark)}
  nav button:active,.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--dark)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
  .btn.big{font-size:22px;padding:14px 28px}
  .btn.red{background:var(--red);color:#fff;box-shadow:0 4px 0 var(--ink)}
  .btn.small{font-size:14px;padding:6px 10px}
  main{max-width:1040px;margin:22px auto 60px;padding:0 16px}
  .card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 8px 0 rgba(42,18,21,.10);border:2px solid var(--line)}
  h1{font-size:36px;margin-bottom:8px}h2{margin-bottom:12px}
  .muted{color:#7a6a6c}.small{font-size:14px}
  .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
  .fade{animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}}
  .pop{animation:pop .4s}
  @keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
  @keyframes bob{50%{transform:translateY(-7px)}}
  .bob{animation:bob 2.2s ease-in-out infinite;display:inline-block}
  .shake{animation:shake .25s 4}

  /* home */
  .hero{text-align:center;padding:20px 0}
  .brand{width:min(600px,92%);display:block;margin:6px auto 14px}
  .hero p{font-size:20px;margin:8px 0 22px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:26px}
  .tile{border-radius:18px;padding:18px;color:#fff;text-align:left;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .15s}
  .tile:hover{transform:translateY(-4px) rotate(-1deg)}
  .tile b{font-size:20px;display:block}.tile span{font-size:34px}

  /* play / sets */
  .playtop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .playtop input{max-width:340px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  .chip{font:inherit;font-weight:600;border:2px solid var(--c);color:var(--c);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;transition:all .15s}
  .chip.on,.chip:hover{background:var(--c);color:#fff}
  .sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .setcard{background:#fff;border:2px solid var(--line);border-left:8px solid var(--c);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer;transition:transform .15s,box-shadow .15s}
  .setcard:hover{transform:translateY(-3px);box-shadow:0 8px 0 rgba(42,18,21,.08)}
  .semoji{font-size:34px;width:54px;height:54px;border-radius:14px;background:var(--c);display:flex;align-items:center;justify-content:center}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
  .mode{font:inherit;text-align:left;border:2px solid var(--line);background:var(--cream);border-radius:14px;padding:12px;cursor:pointer;display:grid;gap:2px;transition:transform .12s,border-color .12s}
  .mode:hover{transform:scale(1.03);border-color:var(--red)}
  .mode span{font-size:28px}.mode small{color:#7a6a6c}

  /* game */
  .hud{display:flex;justify-content:space-between;align-items:center;font-size:22px;font-weight:700;margin-bottom:12px;gap:10px}
  .hud .me{display:flex;align-items:center;gap:8px}
  .tbar{height:10px;background:#f3dccb;border-radius:99px;overflow:hidden;margin-bottom:12px}
  #tfill{height:100%;width:100%;background:#2a9d8f;transition:width .1s linear}
  .q{font-size:28px;font-weight:600;text-align:center;background:#fff;border:2px solid var(--line);border-radius:16px;padding:26px}
  .answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
  .ans{font-family:inherit;font-size:20px;font-weight:600;color:#fff;border:none;border-radius:14px;padding:22px 12px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.25);animation:rise .35s backwards;transition:transform .12s,opacity .2s}
  .ans:hover{transform:translateY(-3px)}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}}
  .ans:nth-child(1){background:#ffb703}.ans:nth-child(2){background:#219ebc}.ans:nth-child(3){background:#2a9d8f}.ans:nth-child(4){background:#e76f51}
  .ans.right{background:#22c55e!important;transform:scale(1.05)}
  .ans.wrong{background:#ef4444!important;animation:shake .2s 2}
  .ans.dim{opacity:.35}
  .chests{display:flex;gap:16px;justify-content:center;margin-top:20px}
  .chest{font-size:76px;cursor:pointer;background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 24px;box-shadow:0 6px 0 var(--dark);transition:transform .15s;animation:pop .4s backwards}
  .chest:nth-child(2){animation-delay:.08s}.chest:nth-child(3){animation-delay:.16s}
  .chest:hover{transform:scale(1.1) rotate(-4deg)}
  .feedback{font-size:38px;font-weight:700;text-align:center;color:var(--red);margin:18px 0}
  .track{display:grid;gap:8px;margin-bottom:14px}
  .lane{position:relative;height:54px;background:repeating-linear-gradient(90deg,#fff 0 30px,#fff7ef 30px 60px);border:2px solid var(--line);border-radius:12px;overflow:hidden}
  .lane.mine{border-color:var(--red)}
  .lname{position:absolute;left:8px;top:2px;font-size:12px;font-weight:600;color:#7a6a6c;z-index:1}
  .runner{position:absolute;top:6px;transition:left .8s cubic-bezier(.3,1.4,.5,1)}
  .flag{position:absolute;right:8px;top:12px;font-size:24px}
  .board{display:grid;gap:8px;margin:14px 0}
  .board div{background:var(--cream);border-radius:12px;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:600;animation:rise .4s backwards}
  .board div.me{background:#ffe1e3;border:2px solid var(--red)}
  .board span{display:flex;align-items:center;gap:8px}

  /* market */
  .special{background:linear-gradient(135deg,#2a1215,#7a1c25);color:#fff;border-radius:18px;padding:16px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
  .special .grow{flex:1;min-width:200px}
  .special h2{margin:0}
  .boxes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
  .box{position:relative;border-radius:18px;padding:18px;text-align:center;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.2);transition:transform .15s}
  .box:hover{transform:translateY(-4px)}
  .box.soon{filter:grayscale(.6);opacity:.8}
  .box .ic{font-size:56px}
  .box .minis{display:flex;justify-content:center;flex-wrap:wrap;margin:6px 0 10px}
  .box s{opacity:.6;font-size:13px}
  .sale,.tag{position:absolute;top:10px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px}
  .sale{left:10px;background:var(--gold);color:var(--ink);animation:bob 1.4s infinite}
  .tag{right:10px;background:rgba(0,0,0,.35)}

  /* rooks */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-bottom:22px}
  .rook{background:var(--cream);border-radius:16px;padding:8px;text-align:center;cursor:pointer;border:3px solid transparent;position:relative;transition:transform .15s}
  .rook:hover{transform:translateY(-3px)}

  .rook.equipped{border-color:var(--gold)}
  .rook .name{font-weight:600;font-size:14px}
  .rook .count{position:absolute;top:6px;right:8px;background:var(--red);color:#fff;border-radius:999px;padding:0 8px;font-size:13px}
  .rook.Legendary:not(.locked){box-shadow:0 0 0 2px #f77f00 inset}
  .rook.Chroma:not(.locked){box-shadow:0 0 14px #c084fc}
  .boxhead{display:flex;align-items:center;gap:10px;margin:6px 0 10px}
  .rar{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  .Common{color:#6c757d}.Uncommon{color:#2a9d8f}.Rare{color:#1d4ed8}.Epic{color:#9b5de5}.Legendary{color:#f77f00}
  .rar.Chroma{background:linear-gradient(90deg,#f00,#f90,#0c0,#09f,#c0f);-webkit-background-clip:text;background-clip:text;color:transparent}
  .rar.Unique{color:#facc15;background:#0a0a0a;padding:1px 6px;border-radius:5px}
  .rar.Mystical{background:linear-gradient(90deg,#a855f7,#111,#a855f7,#111);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 2.5s linear infinite;font-weight:800}
  @keyframes shimmer{to{background-position:300% 0}}
  .rook.Unique:not(.locked){box-shadow:0 0 0 3px #facc15 inset}
  .rook.Mystical:not(.locked){background:#18181b;color:#fff;box-shadow:0 0 18px #a855f7}
  .reveal.Unique{box-shadow:0 0 60px #facc15,0 0 20px #000}.reveal.Mystical{box-shadow:0 0 80px #a855f7,0 0 30px #000;background:#18181b}
  .sacrifice{background:linear-gradient(135deg,#7f1d1d,#0a0a0a);color:#fff;border-color:#000;box-shadow:0 4px 0 #000;animation:bob 1.6s infinite}
  .void{background:radial-gradient(circle,#2e1065,#000);color:#fff;border-color:#000}
  /* ---- THE ROOK cinematic ---- */
  .cine{position:fixed;inset:0;z-index:40;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;animation:fade 1.2s}
  .cine .bar{position:absolute;left:0;right:0;height:9vh;background:#000;z-index:5}
  .cine .bar.t{top:0}.cine .bar.b{bottom:0}
  .cine .stage{position:relative;width:min(88vw,62vh);aspect-ratio:1;transition:filter 1.4s}
  .cine .swarm{position:absolute;inset:4%;z-index:4;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:2px;transition:opacity 1s}
  .cine .swarm span{width:10%;aspect-ratio:1;animation:pop .35s backwards}
  .cine .swarm svg{width:100%;height:100%}
  .cine .cboard{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);border-radius:6px;overflow:hidden;box-shadow:0 0 60px rgba(168,85,247,.25)}
  .cine .cboard div:nth-child(odd){background:#3b2a2c}.cine .cboard div:nth-child(even){background:#1c1213}
  .cine .cboard div.alt:nth-child(odd){background:#1c1213}.cine .cboard div.alt:nth-child(even){background:#3b2a2c}
  .cine .pc{position:absolute;width:12.5%;height:12.5%;display:flex;align-items:center;justify-content:center;transition:left 1.1s cubic-bezier(.6,0,.4,1),top 1.1s cubic-bezier(.6,0,.4,1),transform .6s,opacity .5s;z-index:2}
  .cine .pc svg{width:92%;height:92%}
  .cine .wp{color:#f5f5f4;font-size:min(7vw,5vh);text-shadow:0 2px 0 #000,0 0 10px rgba(255,255,255,.3);line-height:1}
  .cine .king{font-size:min(9vw,6.4vh);transform-origin:50% 90%;transition:transform 1.4s cubic-bezier(.5,0,.6,1)}
  .cine .king.tip{transform:rotate(90deg) translate(10%,-10%)}
  .cine .king.fear{animation:shake .12s infinite}
  .cine .dim{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:0;transition:opacity 1.6s,background 2.4s;background:radial-gradient(circle at 81% 94%,transparent 0 10%,rgba(0,0,0,.9) 24%)}
  .cine .dim.up{background:radial-gradient(circle at 81% 6%,transparent 0 16%,rgba(0,0,0,.85) 34%)}
  .cine .shk{animation:bigshake .45s}
  @keyframes bigshake{0%,100%{transform:translate(0)}20%{transform:translate(-8px,5px)}40%{transform:translate(7px,-6px)}60%{transform:translate(-5px,-3px)}80%{transform:translate(4px,6px)}}
  .cine .shk2{animation:bigshake .8s 2}
  .cine .frag{position:absolute;width:1.6%;height:1.6%;z-index:4;transition:transform 1.2s cubic-bezier(.1,.7,.3,1),opacity 1.2s;pointer-events:none}
  .cine .fire{position:absolute;z-index:4;font-size:min(8vw,5.5vh);transform:translate(-50%,-50%) scale(.2);transition:transform .5s,opacity .9s;pointer-events:none}
  .cine .cap{position:absolute;bottom:11vh;left:4%;right:4%;text-align:center;color:#f5f5f4;font-size:min(5.6vw,34px);letter-spacing:4px;text-transform:uppercase;z-index:6;opacity:0;transition:opacity .9s;font-weight:700;text-shadow:0 0 18px rgba(168,85,247,.55),0 3px 10px #000}
  .cine .cap span{display:inline-block;opacity:0;animation:capIn .5s forwards}
  @keyframes capIn{from{opacity:0;transform:translateY(8px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
  .cine .cap.big{font-size:min(11vw,72px);letter-spacing:12px;color:#fff;text-shadow:0 0 30px #a855f7,0 0 60px #7c3aed,0 4px 12px #000}
  .cine .mate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:7;pointer-events:none}
  .cine .mate span{font-size:min(13vw,10vh);font-weight:800;color:#e63940;letter-spacing:4px;text-shadow:0 0 30px #000,0 6px 0 #2a1215;transform:scale(4) rotate(-8deg);opacity:0;transition:transform .35s cubic-bezier(.2,1.6,.4,1),opacity .2s}
  .cine .mate span.on{transform:scale(1) rotate(-8deg);opacity:1}
  .cine .flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:8;pointer-events:none;transition:opacity .15s}
  .cine .skip{position:absolute;top:calc(9vh + 10px);right:14px;z-index:9;font:inherit;font-size:14px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:5px 12px;cursor:pointer}
  .cine{overflow:hidden;user-select:none;-webkit-user-select:none}
  .cine.blackout>*{visibility:hidden}
  .cine .mbox{position:absolute;right:18px;top:calc(9vh + 14px);z-index:10;width:190px;height:86px;border:3px dashed #a855f7;border-radius:14px;color:#e9d5ff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;font-size:13px;background:rgba(168,85,247,.08);touch-action:none;cursor:none}
  .cine .mbox small{font-size:10px;opacity:.75;padding:0 6px}
  .cine .mbox.wait{animation:mpulse 1.1s infinite;cursor:pointer}
  @keyframes mpulse{50%{box-shadow:0 0 0 8px rgba(168,85,247,.25);border-color:#e9d5ff}}
  .cine .mbox.on{border-style:solid;background:rgba(168,85,247,.18)}
  .cine .ob{position:absolute;display:flex;align-items:center;justify-content:center;z-index:2;transition:left 2.2s cubic-bezier(.4,0,.2,1),top 2.2s cubic-bezier(.4,0,.2,1),transform .6s,opacity .6s,filter .8s}
  .cine .ob svg{width:100%;height:100%}
  .cine .ob.burnt{filter:grayscale(1) brightness(.22) sepia(.5);transform:scale(.78) translateY(10%)}
  .cine .wpc{font-size:min(5.5vw,3.8vh);color:#f5f5f4;text-shadow:0 2px 0 #000,0 0 12px rgba(255,255,255,.45);line-height:1;z-index:3}
  .cine .wpc.back{transition:left .9s cubic-bezier(.1,.8,.3,1),top .9s cubic-bezier(.1,.8,.3,1),transform .9s,opacity 2.6s,filter 2.6s}
  .cine .wpc.gone{opacity:0;filter:drop-shadow(0 0 16px #a855f7) blur(2px)}
  .cine .shot{position:absolute;width:1.5%;height:1.5%;margin:-.75% 0 0 -.75%;border-radius:50%;background:#ffd166;box-shadow:0 0 8px #ff7b00,0 0 18px #ff4d00;z-index:4}
  .cine .wave{position:absolute;left:50%;top:50%;width:20%;height:20%;margin:-10% 0 0 -10%;border-radius:50%;border:4px solid #c084fc;box-shadow:0 0 30px #a855f7,inset 0 0 20px #a855f7;z-index:4;transform:scale(.2);opacity:0;transition:transform .9s cubic-bezier(.1,.8,.3,1),opacity 1.1s ease-in}
  .cine .aura{position:absolute;left:50%;top:50%;width:30%;height:30%;margin:-15% 0 0 -15%;border-radius:50%;background:radial-gradient(circle,rgba(168,85,247,.6),rgba(168,85,247,.15) 50%,transparent 70%);z-index:1;transform:scale(.3);opacity:0;transition:transform 3s ease-out,opacity 1.2s}
  .cine .theRook .shades{transform:translateY(-46px);opacity:0;transition:transform 1.3s cubic-bezier(.5,0,.3,1),opacity .4s}
  .cine .theRook.cool .shades{transform:none;opacity:1}
  .cine .theRook{z-index:5;transition:left 2.6s cubic-bezier(.7,0,.2,1),top 2.6s cubic-bezier(.7,0,.2,1),transform .25s;filter:drop-shadow(0 0 6px #e9d5ff) drop-shadow(0 0 16px #a855f7)}
  .cine .king{z-index:5}
  .reveal{border-radius:50%;display:inline-block;padding:10px}
  .reveal.Rare{box-shadow:0 0 40px #60a5fa}.reveal.Epic{box-shadow:0 0 50px #c084fc}.reveal.Legendary{box-shadow:0 0 60px #fb923c}.reveal.Chroma{box-shadow:0 0 70px #f0abfc,0 0 30px #67e8f9}

  /* trade */
  .tform{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:end}
  .tform label{font-size:13px;font-weight:600;color:#7a6a6c;display:grid;gap:4px}
  .tsearch{position:relative}
  .sugg{position:absolute;left:0;right:0;top:100%;background:#fff;border:2px solid var(--line);border-radius:10px;z-index:4;box-shadow:0 8px 20px rgba(0,0,0,.1);overflow:hidden}
  .sugg:empty{display:none}
  .sugg div{padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;color:var(--ink);font-size:15px}
  .sugg div:hover{background:var(--cream)}
  .prefs{background:var(--cream);border-radius:14px;padding:14px;margin-top:18px;display:grid;gap:8px}
  .prefs .opts{display:flex;gap:16px;flex-wrap:wrap}.prefs label{display:flex;gap:6px;align-items:center;font-weight:600}
  .prefs input[type=radio]{width:auto}
  .offer{background:var(--cream);border-radius:14px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap}
  .offer .what{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

  /* create */
  input,textarea,select{font-family:inherit;font-size:16px;padding:10px;border-radius:10px;border:2px solid #ead8c9;width:100%;background:#fff}
  input:focus,select:focus{outline:none;border-color:var(--red)}
  .qedit{background:var(--cream);border-radius:12px;padding:12px;margin-bottom:10px;display:grid;gap:6px}
  .qedit .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .mine-set{background:var(--cream);border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px}

  /* login */
  .login{max-width:440px;margin:30px auto;text-align:center;display:grid;gap:10px;position:relative}
  .logo{position:relative}
  .ear{position:absolute;left:16.5%;top:13%;width:5.6%;height:64%;cursor:pointer}
  .login form{display:grid;gap:10px}
  .tabs{display:flex;background:var(--cream);border-radius:12px;padding:4px}
  .tabs button{flex:1;font:inherit;font-weight:600;border:none;background:none;padding:9px;border-radius:9px;cursor:pointer;color:#7a6a6c}
  .tabs button.on{background:#fff;color:var(--red);box-shadow:0 2px 0 var(--line)}
  .err{color:#dc2626;font-weight:600;min-height:20px}
  .note{background:#fff7d6;border-radius:10px;padding:10px;font-size:14px}
  .or{color:#7a6a6c}

  /* modal, toast, confetti */
  .modal{position:fixed;inset:0;background:rgba(42,18,21,.6);display:flex;align-items:center;justify-content:center;z-index:9;padding:14px}
  .modal .card{text-align:center;max-width:460px;width:100%;animation:pop .35s;max-height:92vh;overflow:auto}
  .toast{position:fixed;left:50%;top:80px;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:600;padding:10px 18px;border-radius:12px;z-index:30;animation:toast 2.2s forwards;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  .toast.good{background:#16a34a}
  @keyframes toast{0%{opacity:0;top:60px}10%,80%{opacity:1;top:80px}100%{opacity:0}}
  .conf{position:fixed;top:-14px;width:10px;height:14px;z-index:20;border-radius:2px;animation:fall linear forwards;pointer-events:none}
  @keyframes fall{to{transform:translateY(110vh) rotate(800deg)}}
  .loading{text-align:center;padding:60px;font-size:22px;color:#7a6a6c}

  /* titles, achievements, news, create */
  .ttl{display:inline-block;background:linear-gradient(90deg,#7c3aed,#db2777);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:4px;vertical-align:middle;white-space:nowrap}
  .achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
  .ach{display:flex;gap:10px;align-items:flex-start;background:var(--cream);border:2px solid var(--line);border-radius:14px;padding:10px;opacity:.75}
  .ach.ok{opacity:1;border-color:#86efac;background:#f0fdf4}
  .ach .aic{font-size:30px;line-height:1}.ach.ok .aic{animation:bob 2.4s infinite}
  .abar{height:7px;background:#f3dccb;border-radius:99px;overflow:hidden;margin:4px 0 2px}.abar div{height:100%;background:linear-gradient(90deg,#e63940,#f77f00)}
  .news{background:var(--cream);border-radius:14px;padding:12px 14px;margin-top:10px}.news p{margin-top:6px}
  .poll{display:grid;gap:6px;margin-top:10px}
  .popt{position:relative;overflow:hidden;font:inherit;font-weight:600;text-align:left;border:2px solid var(--red);background:#fff;color:var(--ink);border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;transition:transform .1s}
  .popt:hover:not(:disabled){transform:translateY(-2px)}
  .popt.res{border-color:var(--line)}.popt.res.mine{border-color:var(--red)}
  .popt:disabled{cursor:default}
  .popt .pbar{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ffd6d9,#ffe9b8);transition:width .6s;z-index:0}
  .popt .ptxt,.popt .ppct{position:relative;z-index:1}.popt .ppct{color:#7a6a6c;font-size:14px;white-space:nowrap}
  textarea{font-family:inherit;font-size:16px;padding:10px;border-radius:10px;border:2px solid #ead8c9;width:100%;resize:vertical}
  .aopt{display:flex;gap:4px;align-items:center}.aopt input{flex:1}
  .aopt .tick,.aopt .x{border:none;background:none;font-size:18px;cursor:pointer;padding:2px}
  .aopt.ok input{border-color:#2a9d8f;background:#f0fdfa}
  .aopt .x{color:#dc2626;font-size:15px}
  /* live games */
  .codebox{background:var(--ink);color:#fff;border-radius:20px;padding:18px 24px;text-align:center}
  .codebox .code{font-size:64px;font-weight:700;letter-spacing:8px;color:#ffd6d9}
  .pchips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
  .pchip{background:var(--cream);border:2px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;display:flex;align-items:center;gap:6px;font-weight:600;animation:pop .35s}
  .pchip button{border:none;background:none;cursor:pointer;color:#dc2626;font-size:16px}
  .lb{display:grid;gap:6px;margin:12px 0}
  .lb div{display:grid;grid-template-columns:40px 1fr auto auto;gap:10px;align-items:center;background:var(--cream);border-radius:12px;padding:6px 12px;font-weight:600;transition:all .3s}
  .lb div.me{background:#ffe1e3;border:2px solid var(--red)}
  .lb .pl{display:flex;align-items:center;gap:8px}
  .podium{display:flex;justify-content:center;align-items:flex-end;gap:12px;margin:16px 0}
  .podium>div{text-align:center;font-weight:700}
  .podium .step{border-radius:12px 12px 0 0;color:#fff;font-size:28px;display:flex;align-items:flex-start;justify-content:center;padding-top:6px;width:110px}
  .joinbox{display:flex;gap:8px;max-width:420px;margin:0 auto}
  .joinbox input{font-size:26px;text-align:center;letter-spacing:6px;font-weight:700}
  .bigclock{font-size:40px;font-weight:700}
  .prog{height:18px;background:#f3dccb;border-radius:99px;overflow:hidden;margin-bottom:12px}
  .prog div{height:100%;background:linear-gradient(90deg,#e63940,#f77f00);transition:width .6s}
  .badge{background:#ffb703;color:var(--ink);border-radius:8px;padding:1px 7px;font-size:12px;font-weight:700}
  @media(max-width:700px){
    header{flex-direction:column;gap:8px;position:static}.answers,.modes{grid-template-columns:1fr}
    .tform{grid-template-columns:1fr}.q{font-size:22px}
  }
</style>

<!-- Firebase loader: exposes a small window.FB API to the game -->
<script type="module">
const cfg = window.FIREBASE_CONFIG || {};
if (window.FB) {
  // already provided (e.g. testing)
} else if (!cfg.apiKey || cfg.apiKey.startsWith("PASTE")) {
  window.dispatchEvent(new Event("fb-none"));
} else {
  try {
    const V = "10.12.2", base = `https://www.gstatic.com/firebasejs/${V}/`;
    const { initializeApp } = await import(base + "firebase-app.js");
    const A = await import(base + "firebase-auth.js");
    const F = await import(base + "firebase-firestore.js");
    const app = initializeApp(cfg), auth = A.getAuth(app), db = F.getFirestore(app);
    const email = n => n.toLowerCase() + "@redpup.game";
    const userDoc = uid => F.doc(db, "users", uid);
    window.FB = {
      onAuth: cb => A.onAuthStateChanged(auth, u => cb(u ? { uid: u.uid, emailName: (u.email || "").split("@")[0] } : null)),
      async signUp(name, pw, realEmail) {
        // log-in email is their real email if they gave one, otherwise a hidden username@redpup.game
        const cred = await A.createUserWithEmailAndPassword(auth, realEmail || email(name), pw);
        try { await F.setDoc(F.doc(db, "usernames", name.toLowerCase()), { uid: cred.user.uid, name }); }
        catch (e) { await cred.user.delete().catch(() => {}); throw { code: "taken" }; } // username already used
        return cred.user.uid;
      },
      currentEmail: () => (auth.currentUser && auth.currentUser.email) || "",
      resetPassword: em => A.sendPasswordResetEmail(auth, em.trim()),
      async addEmail(newEmail, pw) {
        const u = auth.currentUser;
        await A.reauthenticateWithCredential(u, A.EmailAuthProvider.credential(u.email, pw));
        await A.verifyBeforeUpdateEmail(u, newEmail.trim());
      },
      async changePassword(oldPw, newPw) {
        const u = auth.currentUser;
        await A.reauthenticateWithCredential(u, A.EmailAuthProvider.credential(u.email, oldPw));
        await A.updatePassword(u, newPw);
      },
      async ensureUsername(uid, name) {
        const ref = F.doc(db, "usernames", name.toLowerCase());
        if (!(await F.getDoc(ref)).exists()) await F.setDoc(ref, { uid, name });
      },
      signIn: (id, pw) => A.signInWithEmailAndPassword(auth, id.includes("@") ? id.trim() : email(id), pw),
      signOut: () => A.signOut(auth),
      async getUser(uid) { const s = await F.getDoc(userDoc(uid)); return s.exists() ? s.data() : null; },
      saveUser: (uid, data) => F.setDoc(userDoc(uid), data),
      // only writes if nobody saved a newer version (another tab/device) since we loaded
      saveUserSafe: (uid, data, baseRev) => F.runTransaction(db, async tx => {
        const cur = await tx.get(userDoc(uid));
        if (cur.exists() && (cur.data().rev || 0) > baseRev) throw { code: "stale", data: cur.data() };
        tx.set(userDoc(uid), data);
      }),
      watchUser: (uid, cb) => F.onSnapshot(userDoc(uid), s => cb(s.exists() ? s.data() : null, s.metadata.hasPendingWrites)),
      async lookup(name) { const s = await F.getDoc(F.doc(db, "usernames", name.toLowerCase())); return s.exists() ? s.data() : null; },
      async offer(uid, data, trade) {
        const b = F.writeBatch(db);
        b.set(userDoc(uid), data);
        b.set(F.doc(F.collection(db, "trades")), { ...trade, status: "open", created: F.serverTimestamp() });
        await b.commit();
      },
      async setTrade(id, status, uid, data) {
        const b = F.writeBatch(db);
        b.update(F.doc(db, "trades", id), { status, updated: F.serverTimestamp() });
        b.set(userDoc(uid), data);
        await b.commit();
      },
      async searchUsers(term) {
        const t = term.toLowerCase(), c = F.collection(db, "usernames");
        const s = await F.getDocs(F.query(c, F.where(F.documentId(), ">=", t), F.where(F.documentId(), "<=", t + "\uf8ff"), F.limit(8)));
        return s.docs.map(d => d.data());
      },
      setTradePrefs: (name, tradeMode, allow) => F.updateDoc(F.doc(db, "usernames", name.toLowerCase()), { tradeMode, allow }),
      async isAdmin(uid) { return (await F.getDoc(F.doc(db, "admins", uid))).exists(); },
      setRank: (uid, r) => F.setDoc(F.doc(db, "ranks", uid), { ...r, at: F.serverTimestamp() }),
      async ranks() {
        const s = await F.getDocs(F.query(F.collection(db, "ranks"), F.orderBy("rooks", "desc"), F.limit(50)));
        return s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.rooks - a.rooks) || ((b.total || 0) - (a.total || 0)));
      },
      logIncident: d => F.addDoc(F.collection(db, "incidents"), { ...d, at: F.serverTimestamp() }),
      async incidents() {
        const s = await F.getDocs(F.query(F.collection(db, "incidents"), F.orderBy("at", "desc"), F.limit(60)));
        return s.docs.map(d => ({ id: d.id, ...d.data(), at: (d.data().at && d.data().at.toMillis) ? d.data().at.toMillis() : 0 }));
      },
      delIncident: id => F.deleteDoc(F.doc(db, "incidents", id)),
      async isBanned(uid) { return (await F.getDoc(F.doc(db, "bans", uid))).exists(); },
      ban: (uid, name, why) => F.setDoc(F.doc(db, "bans", uid), { name, why, at: F.serverTimestamp() }),
      unban: uid => F.deleteDoc(F.doc(db, "bans", uid)),
      async bans() { const s = await F.getDocs(F.collection(db, "bans")); return s.docs.map(d => ({ id: d.id, ...d.data() })); },
      async allRanks() { const s = await F.getDocs(F.collection(db, "ranks")); return s.docs.map(d => ({ id: d.id, name: d.data().name })); },
      async news() {
        const s = await F.getDocs(F.query(F.collection(db, "news"), F.orderBy("at", "desc"), F.limit(20)));
        return s.docs.map(d => ({ id: d.id, ...d.data(), at: (d.data().at && d.data().at.toMillis) ? d.data().at.toMillis() : 0 }));
      },
      postNews: n => F.addDoc(F.collection(db, "news"), { ...n, at: F.serverTimestamp() }),
      async pollState(newsId, uid, n) {
        const c = F.collection(db, "news", newsId, "votes");
        const counts = await Promise.all([...Array(n).keys()].map(i => F.getCountFromServer(F.query(c, F.where("choice", "==", i))).then(s => s.data().count)));
        const mine = await F.getDoc(F.doc(db, "news", newsId, "votes", uid));
        return { counts, mine: mine.exists() ? mine.data().choice : null };
      },
      vote: (newsId, uid, choice) => F.setDoc(F.doc(db, "news", newsId, "votes", uid), { choice, at: F.serverTimestamp() }),
      closePoll: newsId => F.updateDoc(F.doc(db, "news", newsId), { "poll.closed": true }),
      delNews: id => F.deleteDoc(F.doc(db, "news", id)),
      async getTitles(name) { const s = await F.getDoc(F.doc(db, "titles", name.toLowerCase())); return s.exists() ? (s.data().list || []) : []; },
      grantTitle: (name, t) => F.setDoc(F.doc(db, "titles", name.toLowerCase()), { list: F.arrayUnion(t) }, { merge: true }),
      revokeTitle: (name, t) => F.setDoc(F.doc(db, "titles", name.toLowerCase()), { list: F.arrayRemove(t) }, { merge: true }),
      async isTeacher(uid) { return (await F.getDoc(F.doc(db, "teachers", uid))).exists(); },
      async getGame(code) { const s = await F.getDoc(F.doc(db, "games", code)); return s.exists() ? s.data() : null; },
      createGame: (code, data) => F.setDoc(F.doc(db, "games", code), data),
      updateGame: (code, patch) => F.updateDoc(F.doc(db, "games", code), patch),
      watchGame: (code, cb) => F.onSnapshot(F.doc(db, "games", code), s => cb(s.exists() ? s.data() : null)),
      joinGame: (code, uid, data) => F.setDoc(F.doc(db, "games", code, "players", uid), data),
      updatePlayer: (code, uid, patch) => F.updateDoc(F.doc(db, "games", code, "players", uid), patch),
      kick: (code, uid) => F.deleteDoc(F.doc(db, "games", code, "players", uid)),
      watchPlayers: (code, cb) => F.onSnapshot(F.collection(db, "games", code, "players"), s => cb(s.docs.map(d => ({ id: d.id, ...d.data() })))),
      async getPlayers(code) { const s = await F.getDocs(F.collection(db, "games", code, "players")); return s.docs.map(d => ({ id: d.id, ...d.data() })); },
      sendEvent: (code, ev) => F.addDoc(F.collection(db, "games", code, "events"), ev),
      watchEvents: (code, uid, cb) => F.onSnapshot(F.query(F.collection(db, "games", code, "events"), F.where("to", "==", uid)),
        s => s.docChanges().forEach(c => { if (c.type === "added") cb({ id: c.doc.id, ...c.doc.data() }); })),
      async trades(uid) {
        const c = F.collection(db, "trades");
        const [a, b] = await Promise.all([F.getDocs(F.query(c, F.where("from", "==", uid))), F.getDocs(F.query(c, F.where("to", "==", uid)))]);
        return [...a.docs, ...b.docs].map(d => ({ id: d.id, ...d.data(), t: d.data().created?.toMillis?.() || 0 })).sort((x, y) => y.t - x.t);
      }
    };
    window.dispatchEvent(new Event("fb-ready"));
  } catch (e) {
    console.error(e); window.FB_ERROR = "couldn't connect"; window.dispatchEvent(new Event("fb-none"));
  }
}

const BAD=["fuck","shit","bitch","dick","porn","sex","nigg","fag","cunt","whore","slut"];
function fbErr(e){ const c=(e&&e.code)||"";
  if(c==="taken") return "That username is taken.";
  if(c.includes("email-already-in-use")) return "That username or email is already used.";
  if(c.includes("invalid-email")) return "That email doesn't look right.";
  if(c.includes("requires-recent-login")) return "Please log out and back in, then try again.";
  if(c.includes("invalid-credential")||c.includes("wrong-password")||c.includes("user-not-found")||c.includes("invalid-login")) return "Wrong password (or username/email).";
  if(c.includes("weak-password")) return "Password needs 6+ characters.";
  if(c.includes("too-many-requests")) return "Too many tries. Wait a minute and try again.";
  if(c.includes("network")) return "No internet connection.";
  const m=String((e&&e.message)||"");
  if(c.includes("operation-not-allowed")) return "Firebase setup: turn on Email/Password in Authentication → Sign-in method.";
  if(c.includes("configuration-not-found")) return "Firebase setup: open Authentication and click Get started, then turn on Email/Password.";
  if(c.includes("api-key")) return "Firebase setup: the apiKey in index.html is wrong.";
  if(c.includes("permission-denied")) return "Firebase setup: paste firestore.rules into Firestore → Rules and click Publish.";
  if(m.includes("does not exist")||c.includes("not-found")) return "Firebase setup: create the Firestore Database (Build → Firestore Database → Create database).";
  if(c.includes("unavailable")||m.includes("offline")) return "Can't reach Firebase — the Firestore Database may not be created yet, or this network blocks it.";
  return "Something went wrong ("+(c||m||"unknown")+")."; }

    clearInterval(fadeT); const a=audio;

    songI=(songI+1)%SONGS.length;   // next game gets the next song
  }

  let muted=false; try{ muted=localStorage.getItem("redpup_muted")==="1"; }catch(e){}
  const hz=m=>440*Math.pow(2,(m-69)/12);
  function init(){
    try{
      if(!ctx){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
        ctx=new AC(); master=ctx.createGain(); master.gain.value=muted?0:.45; master.connect(ctx.destination);
        // "bus" = cinematic sounds, sent dry + through a big-hall reverb
        bus=ctx.createGain(); bus.gain.value=1; bus.connect(master);
        const conv=ctx.createConvolver(), len=ctx.sampleRate*3.2, ir=ctx.createBuffer(2,len,ctx.sampleRate);
        for(let ch=0;ch<2;ch++){ const d=ir.getChannelData(ch); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6); }
        conv.buffer=ir; wet=ctx.createGain(); wet.gain.value=.38; bus.connect(conv); conv.connect(wet); wet.connect(master);
        noiseBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
      if(ctx.state==="suspended") ctx.resume();
    }catch(e){ return null; }
    return ctx;
  }
  function tone(f,t,dur,type="square",vol=.1,glideTo=null,attack=.01,dest){
    const o=ctx.createOscillator(), g=ctx.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
    if(glideTo) o.frequency.exponentialRampToValueAtTime(glideTo,t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+attack); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(dest||master); o.start(t); o.stop(t+dur+.05);
  }
  function noise(t,dur,vol=.05,type="highpass",freq=6000,dest,sweepTo){
    const s=ctx.createBufferSource(), f=ctx.createBiquadFilter(), g=ctx.createGain(); s.buffer=noiseBuf;
    f.type=type; f.frequency.setValueAtTime(freq,t); if(sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo,t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(dest||master); s.start(t); s.stop(t+dur+.05);
  }
  // warm "strings": 3 detuned saws through a soft low-pass, slow swell
  function strings(m,t,dur,vol=.03,cut=1400){
    const f=ctx.createBiquadFilter(), g=ctx.createGain(); f.type="lowpass"; f.frequency.value=cut; f.Q.value=.4;
    g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(vol,t+Math.min(1,dur*.35)); g.gain.setValueAtTime(vol,t+dur*.75); g.gain.linearRampToValueAtTime(.0001,t+dur+.6);
    f.connect(g); g.connect(bus);
    [-8,0,7].forEach(dt=>{ const o=ctx.createOscillator(); o.type="sawtooth"; o.frequency.value=hz(m); o.detune.value=dt; o.connect(f); o.start(t); o.stop(t+dur+.7); });
  }
  const kick=(t,v=.5)=>tone(150,t,.18,"sine",v,40,.005);
  // deep taiko-style drum
  const taiko=(t,v=.6)=>{ tone(75,t,.8,"sine",v,38,.004,bus); tone(150,t,.12,"triangle",v*.4,70,.002,bus); noise(t,.18,v*.35,"lowpass",700,bus); };
  // a scary-big "BRAAAM"
  function braam(t){
    const ws=ctx.createWaveShaper(), curve=new Float32Array(1024); for(let i=0;i<1024;i++){ const x=i/512-1; curve[i]=Math.tanh(x*3.2); } ws.curve=curve;
    const f=ctx.createBiquadFilter(), g=ctx.createGain(); f.type="lowpass"; f.frequency.setValueAtTime(180,t); f.frequency.exponentialRampToValueAtTime(1500,t+.35); f.frequency.exponentialRampToValueAtTime(300,t+3);
    g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(.32,t+.04); g.gain.exponentialRampToValueAtTime(.0001,t+3.4);
    ws.connect(f); f.connect(g); g.connect(bus);
    [33,45,52,57].forEach((m,k)=>[-12,0,10].forEach(dt=>{ const o=ctx.createOscillator(); o.type="sawtooth"; o.frequency.value=hz(m); o.detune.value=dt+k; o.connect(ws); o.start(t); o.stop(t+3.5); }));
    tone(110,t,2.2,"sine",.9,24,.003,master); noise(t,1.6,.45,"lowpass",420,bus);
  }

  // ---- tracks ----
  const CH=[[60,"maj"],[57,"min"],[53,"maj"],[55,"maj"]];
  const EPIC=[[45,[57,60,64]],[41,[57,60,65]],[48,[55,60,64]],[43,[55,59,62]]];   // Am – F – C – G
  const TRACKS={
    battle:{bpm:92,div:2,
      step(s,t,d){
        const i=s%8, bar=Math.floor(s/8)%4, [bass,chord]=EPIC[bar];
        if(i===0){ strings(bass,t,d*8,.045,700); chord.forEach(m=>strings(m,t,d*8,.022,lvl>=3?2200:1300)); }
        if(lvl>=1||s>=16){ if(i%1===0) tone(hz(bass+12),t,d*.7,"sawtooth",.028+lvl*.004,null,.004,bus); }      // driving ostinato
        if(i===0||i===4) taiko(t,.55);
        if(lvl>=1&&(i===3||i===7)) taiko(t,.35);
        if(lvl>=3&&i%2===1) taiko(t,.25);
        if(lvl>=4&&i===0&&bar%2===1) chord.concat(chord.map(m=>m+12)).forEach((m,k)=>tone(hz(m+12),t+k*d/4,d*.5,"triangle",.02,null,.005,bus));
      }},
  };
  function loop(){
    if(!cur) return; const d=60/cur.bpm/cur.div;
    while(nextT<ctx.currentTime+.15){ cur.step(step,nextT,d); step++; nextT+=d; }
  }
  // ---- narrator (built-in text-to-speech) ----
  const USE_VOICE=false;   // built-in computer voices sounded robotic — we use recorded lines instead
  const NARR_LINES=["In a world where every Rook stood together…","The White army came for them.","They were surrounded.","One by one… they fell.",
    "Not even the legends survived.","Not even the rarest.","But they forgot… about one Rook.","THE ROOK."];
  const narrA={};
  function narrAudio(i){ if(!narrA[i]){ const a=new Audio(`music/narr${i+1}.mp3`); a.preload="auto"; narrA[i]=a; } return narrA[i]; }
  let voice=null;
  function pickVoice(){
    try{ const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)); if(!vs.length) return;
      const pref=["Google UK English Male","Daniel","Microsoft Guy","Microsoft David","Arthur","Alex","Fred","Aaron","Rishi","Google US English"];
      voice=pref.map(n=>vs.find(v=>v.name.includes(n))).find(Boolean)||vs.find(v=>/male/i.test(v.name))||vs[0]; }catch(e){}
  }
  try{ pickVoice(); speechSynthesis.addEventListener("voiceschanged",pickVoice); }catch(e){}
  // ---- cutscene song ("Royalty"): build-up clip + drop clip ----
  const CINE={build:"music/royalty-build.mp3",drop:"music/royalty-drop.mp3"}, DROP_AT=2.37, CINE_VOL=.9;
  const cineA={}; let ducked=false;
  function cineAudio(k){ if(!cineA[k]){ const a=new Audio(CINE[k]); a.preload="auto"; cineA[k]=a; } return cineA[k]; }
  function cineVol(a,target,ms){ clearInterval(a._f); const step=(target-a.volume)/Math.max(1,ms/40);
    a._f=setInterval(()=>{ a.volume=Math.min(1,Math.max(0,a.volume+step)); if(Math.abs(a.volume-target)<=Math.abs(step)+.001){ a.volume=target; clearInterval(a._f); if(target===0) a.pause(); } },40); }
  function duck(on){ ducked=on; if(ctx&&bus) bus.gain.setTargetAtTime(on?.45:1,ctx.currentTime,.15);
    Object.values(cineA).forEach(a=>{ if(!a.paused&&!a._stopping) cineVol(a,on?CINE_VOL*.35:CINE_VOL,250); }); }

  return {
    init,
    get muted(){ return muted; },
    play(name){ if(name==="game"){ this.stop(); init(); playSongs(); return; }
      if(!init()) return; this.stop(); cur=TRACKS[name]; step=0; lvl=0; TRACKS.battle.bpm=92; nextT=ctx.currentTime+.06; if(cur.start) cur.start(); timer=setInterval(loop,40); },
    stop(){ stopSongs(); clearInterval(timer); timer=null; if(cur&&cur.stop&&ctx) cur.stop(); cur=null; },
    level(n){ lvl=n; if(cur===TRACKS.battle) TRACKS.battle.bpm=92+n*8; },
    // speak a line; resolves when done (or after a guess if speech isn't available / muted)
    say(text,{rate=.82,pitch=.55}={}){
      return new Promise(res=>{
        const guess=Math.max(1400,text.length*80)/rate, minShow=Math.max(1500,text.length*55), t0=Date.now();
        let done=false; const fin=()=>{ if(done) return; const left=minShow-(Date.now()-t0); if(left>0) return setTimeout(fin,left); done=true; duck(false); res(); };
        const ni=NARR_LINES.indexOf(text);
        if(ni>=0&&!muted){                                    // play the recorded line
          try{ const a=narrAudio(ni); a.currentTime=0; a.volume=1; a.onended=fin; a.onerror=()=>setTimeout(fin,minShow);
            duck(true); a.play().catch(()=>{ duck(false); setTimeout(fin,minShow); }); setTimeout(fin,15000); return; }catch(e){}
        }
        if(!USE_VOICE||muted||!window.speechSynthesis){ setTimeout(fin,minShow); return; }
        try{ const u=new SpeechSynthesisUtterance(text.replace(/…/g,"...")); if(voice) u.voice=voice; u.rate=rate; u.pitch=pitch; u.volume=1;
          u.onend=fin; u.onerror=fin; duck(true); speechSynthesis.speak(u); setTimeout(fin,guess+4000); }
        catch(e){ setTimeout(fin,guess); }
      });
    },
    hush(){ try{ speechSynthesis.cancel(); }catch(e){} Object.values(narrA).forEach(a=>{ try{ a.pause(); }catch(e){} }); },
    preloadCine(){ try{ cineAudio("build").load(); cineAudio("drop").load(); NARR_LINES.forEach((_,i)=>narrAudio(i).load()); }catch(e){} },
    // play a cutscene clip; resolves true if it really started
    cine(k){ if(muted) return Promise.resolve(false);
      try{ const a=cineAudio(k); a._stopping=false; clearInterval(a._f); a.currentTime=0; a.volume=ducked?CINE_VOL*.35:CINE_VOL; a.muted=muted;
        return a.play().then(()=>true).catch(()=>false); }catch(e){ return Promise.resolve(false); } },
    cineStop(k,ms=900){ const ks=k?[k]:Object.keys(cineA); ks.forEach(x=>{ const a=cineA[x]; if(a&&!a.paused){ a._stopping=true; cineVol(a,0,ms); } }); },
    // start the drop clip and resolve exactly when the beat drops (falls back to the synth riser)
    dropSync(lead=0){ return new Promise(async res=>{
        const ok=await this.cine("drop");
        if(!ok){ this.sfx("riser"); setTimeout(()=>res(false),2350); return; }
        const a=cineA.drop, t0=Date.now();
        const tick=()=>{ if(a.currentTime>=DROP_AT-lead) return res(true); if(Date.now()-t0>7000) return res(true); requestAnimationFrame(tick); };
        tick(); }); },
    sfx(name){
      if(!init()) return; const t=ctx.currentTime+.01;
      if(name==="fire"){ noise(t,.4,.05,"bandpass",900,bus,300); tone(220,t,.25,"sawtooth",.015,90,.01,bus); }
      if(name==="bigfire"){ noise(t,2,.22,"lowpass",2400,bus,200); tone(110,t,1.6,"sawtooth",.07,35,.01,bus); taiko(t,.8); }
      if(name==="riser"){ noise(t,2.6,.0001,"highpass",300,bus); const s=ctx.createBufferSource(), f=ctx.createBiquadFilter(), g=ctx.createGain();
        s.buffer=noiseBuf; f.type="bandpass"; f.Q.value=3; f.frequency.setValueAtTime(200,t); f.frequency.exponentialRampToValueAtTime(5000,t+2.4);
        g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.35,t+2.35); g.gain.setValueAtTime(.0001,t+2.42);
        s.connect(f); f.connect(g); g.connect(bus); s.start(t); s.stop(t+2.5); tone(110,t,2.4,"sawtooth",.04,880,2.2,bus); }
      if(name==="slam"){ braam(t); }
      if(name==="impact"){ tone(110,t,1.8,"sine",.8,26,.003,master); noise(t,1.1,.35,"lowpass",450,bus); }
      if(name==="shine"){ [1568,2093,2637,3136].forEach((f,k)=>tone(f,t+k*.07,.9,"sine",.06,null,.005,bus)); }
      if(name==="triumph"){ [45,57,61,64,69,73,76].forEach(m=>strings(m,t,5,.03,2600)); taiko(t,.8); taiko(t+.5,.5);
        [81,85,88,93].forEach((m,k)=>tone(hz(m),t+.6+k*.16,1.4,"triangle",.04,null,.005,bus)); }
      if(name==="win"){ [72,76,79,84].forEach((m,k)=>tone(hz(m),t+k*.11,k===3?.6:.18,"square",.06)); }
    },
    toggle(){ muted=!muted; try{ localStorage.setItem("redpup_muted",muted?"1":"0"); }catch(e){}
      if(audio) audio.muted=muted; Object.values(cineA).forEach(a=>a.muted=muted); if(muted) this.hush();
      if(init()) master.gain.setTargetAtTime(muted?0:.45,ctx.currentTime,.05); return muted; },
  };
})();

let G=null, qTimer=null, gTimer=null;
function stopTimers(){ clearInterval(qTimer); clearInterval(gTimer); qTimer=gTimer=null; }

function startGame(i,mode){
  closeModal(); stopTimers();
  const set=allSets()[i];
  const bots=shuffle(["Biscuit","Rusty","Maple","Pepper","Scout","Bean","Waffles","Ziggy"]).slice(0,3)
    .map(n=>({name:n,gold:0,pts:0,pos:0,rook:ROOKS[rand(0,20)][0]}));
  G={set,mode,deck:[],n:0,total:Math.min(set.qs.length,10),gold:0,pts:0,pos:0,correct:0,streak:0,best:0,bots};
  Music.play("game");

}
function drawQ(){ if(!G.deck.length) G.deck=shuffle([...G.set.qs.keys()]); const x=G.set.qs[G.deck.pop()], cs=x.c&&x.c.length?x.c:[0];
  return {q:x.q,ans:shuffle(x.a.map((o,k)=>({o,right:cs.includes(k)})))}; }
function ask(top,perQ,delay,cb){
  const Q=drawQ(), t0=Date.now(), g=G; G.locked=false; G.Q=Q;
  app.innerHTML=`<div class="fade">${top}${perQ?`<div class="tbar"><div id="tfill"></div></div>`:""}<div class="q pop">${esc(Q.q)}</div>
    <div class="answers">${Q.ans.map((a,k)=>`<button class="ans" style="animation-delay:${k*70}ms" onclick="pick(${k})">${esc(a.o)}</button>`).join("")}</div></div>`;
  G.onPick=k=>{

// "The Last Stand" v2 — the White army burns every Rook (outside -> in, rarest last),
// then THE ROOK slams down, knocks them back, puts on his shades, and they fade away.
// ---- hidden fingerprint: each player's cutscene puts the regular Rooks in their own order ----
const CUT_ORDER=["Common","Uncommon","Rare","Epic","Chroma","Legendary","Unique"];
const FIXED_RARS=["Legendary","Chroma","Unique"];
function hashStr(s){ let h=2166136261; for(const ch of s){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function cutsceneGroups(uid,names){
  const rng=mulberry32(hashStr("rook-order-"+uid));
  return CUT_ORDER.map(r=>names.filter(n=>R[n]&&R[n][1]===r)).filter(g=>g.length).map(g=>{
    if(FIXED_RARS.includes(R[g[0]][1])) return g;
    const a=[...g]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; });
}
const outerRing=uid=>cutsceneGroups(uid,sacList().map(r=>r[0]))[0];   // Commons, clockwise from the top
function lastStand(allNames){

    const uniq=R[g[0]][1]==="Unique", ri=rings.indexOf(g);
    const r=uniq?(g.length>1?5:0):(42-ri*(30/Math.max(1,rings.length-1)));
    g.forEach((n,i)=>{ const a=(i/g.length)*Math.PI*2+gi*.37-Math.PI/2;
      rooksAt.push({name:n,x:50+Math.cos(a)*r,y:50+Math.sin(a)*r,size:uniq?9:6.2,group:gi}); });
  });
  const W_GLYPHS=["♙","♙","♙","♙","♙","♙","♙","♙","♖","♘","♗","♕","♔","♗","♘","♖"];

  const at=(a,r)=>({x:50+Math.cos(a)*r,y:50+Math.sin(a)*r});

  return new Promise(done=>{
    let skipped=false, finished=false;
    const el=document.createElement("div"); el.className="cine";
    let unguard=()=>{};
    const end=(fast)=>{ if(finished) return; finished=true; unguard();
      try{ navigator.keyboard&&navigator.keyboard.unlock&&navigator.keyboard.unlock(); }catch(e){}
      try{ if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); }catch(e){} el.style.transition=`opacity ${fast?.25:.7}s`; el.style.opacity=0; setTimeout(()=>{ el.remove(); done(); },fast?250:700); };
    const wait=ms=>new Promise(r=>setTimeout(r,ms));
    const box=(x,y,s)=>`left:${x}%;top:${y}%;width:${s}%;height:${s}%;margin-left:${-s/2}%;margin-top:${-s/2}%`;
    el.innerHTML=`<div class="bar t"></div><div class="bar b"></div>
      <div class="stage" id="cs"><div class="cboard">${[...Array(64)].map((_,i)=>`<div class="${Math.floor(i/8)%2?"alt":""}"></div>`).join("")}</div>
        <div class="aura" id="aura"></div>
        ${rooksAt.map((p,i)=>`<div class="ob" id="r${i}" style="${box(p.x,p.y,p.size)}">${rookSVG(p.name,60)}</div>`).join("")}
        ${whites.map((w,i)=>{ const p=at(w.a,78); return `<div class="ob wpc" id="w${i}" style="${box(p.x,p.y,6)}">${w.g}</div>`; }).join("")}
        <div class="ob theRook" id="tr" style="${box(50,-40,15)};opacity:0">${rookSVG(SECRET,60,"",{eyes:true})}</div>
        <div class="wave" id="wave"></div></div>

      <button class="skip">Skip ⏭</button>
      <div class="mbox" id="mbox"><b>🖱️ Keep your mouse here</b><small>Moving it, clicking or pressing a key ends the cutscene</small></div>`;
    document.body.appendChild(el);
    el.querySelector(".skip").onclick=()=>{ skipped=true; Music.stop(); Music.hush(); Music.cineStop(null,400); end(); };
    // ---- anti-capture: the cutscene only plays while the mouse stays in the box ----
    const mb=el.querySelector("#mbox");
    let guardT0=0;
    const abort=(why)=>{ if(finished||skipped) return; skipped=true; el.classList.add("blackout");
      if(MODE==="fb"&&!TEST&&UID) FB.logIncident({uid:UID,name:NAME(),why,secs:Math.round((Date.now()-guardT0)/1000)}).catch(()=>{});
      Music.stop(); Music.hush(); Music.cineStop(null,150); end(true); setTimeout(()=>toast(`⛔ Cutscene stopped — ${why}`),300); };
    let touchMode=false;
    const gate=()=>new Promise(res=>{
      mb.classList.add("wait");
      const go=(touch)=>{ if(mb.classList.contains("on")) return; touchMode=touch; mb.classList.remove("wait"); mb.classList.add("on");
        mb.querySelector("b").textContent=touch?"👆 Keep holding here":"🖱️ Keep your mouse here"; res(true); };
      mb.addEventListener("pointerenter",e=>{ if(e.pointerType==="mouse") go(false); });
      mb.addEventListener("pointerdown",e=>{ if(e.pointerType!=="mouse"){ e.preventDefault(); go(true); } });
      // if the mouse is already resting inside the box
      mb.addEventListener("pointermove",e=>{ if(e.pointerType==="mouse") go(false); });
    });
    const guard=()=>{
      const offs=[];
      const on=(t,ev,fn,o)=>{ t.addEventListener(ev,fn,o); offs.push(()=>t.removeEventListener(ev,fn,o)); };
      on(mb,"pointerleave",e=>{ if(!touchMode||e.pointerType!=="mouse") abort(touchMode?"you let go of the box":"your mouse left the box"); });
      on(window,"pointerup",e=>{ if(touchMode&&e.pointerType!=="mouse") abort("you let go of the box"); },true);
      on(window,"pointercancel",()=>abort("you let go of the box"),true);
      on(window,"pointerdown",e=>{ if(!(touchMode&&e.pointerType!=="mouse"&&e.isPrimary)) abort("you clicked"); },true);
      on(window,"contextmenu",e=>{ e.preventDefault(); abort("you clicked"); },true);
      on(window,"keydown",e=>{ e.preventDefault(); abort("you pressed a key"); },true);
      on(window,"blur",()=>abort("you left the page"));
      on(document,"visibilitychange",()=>{ if(document.visibilityState!=="visible") abort("you left the page"); });
      on(document,"fullscreenchange",()=>{ if(!document.fullscreenElement) abort("you left full screen"); });
      unguard=()=>offs.forEach(f=>f());
    };
    const $=id=>el.querySelector("#"+id), stage=$("cs");
    const cap=async(t,ms)=>{ if(skipped) return; const c=$("cap"); c.style.opacity=0; await wait(350); c.textContent=t; c.style.opacity=t?1:0; if(ms){ await wait(ms); c.style.opacity=0; } };
    const shake=(cls="shk")=>{ stage.classList.remove("shk","shk2"); void stage.offsetWidth; stage.classList.add(cls); };
    const flash=(v=.5)=>{ $("fl").style.opacity=v; setTimeout(()=>{ $("fl").style.opacity=0; },150); };
    const burst=(x,y,colors,n=12,spread=50)=>{ for(let i=0;i<n;i++){ const f=document.createElement("div"); f.className="frag";
        f.style.left=x+"%"; f.style.top=y+"%"; f.style.background=colors[i%colors.length]; stage.appendChild(f);
        requestAnimationFrame(()=>requestAnimationFrame(()=>{ const a=Math.random()*Math.PI*2, d=spread*(.4+Math.random()*.8);
          f.style.transform=`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) rotate(${Math.random()*540}deg)`; f.style.opacity=0; }));
        setTimeout(()=>f.remove(),1400); } };
    const flame=(x,y,big)=>{ const f=document.createElement("div"); f.className="fire"; f.textContent="🔥"; if(big) f.style.fontSize="min(16vw,11vh)";
        f.style.left=x+"%"; f.style.top=y+"%"; stage.appendChild(f);
        requestAnimationFrame(()=>requestAnimationFrame(()=>{ f.style.transform=`translate(-50%,-65%) scale(${big?1.6:1.1})`; }));
        setTimeout(()=>{ f.style.opacity=0; },big?1400:550); setTimeout(()=>f.remove(),big?2400:1500); };
    const wpos=whites.map(w=>at(w.a,78));
    const shot=(from,to,ms=380)=>new Promise(res=>{ const s=document.createElement("div"); s.className="shot";
        s.style.left=from.x+"%"; s.style.top=from.y+"%"; s.style.transition=`left ${ms}ms linear,top ${ms}ms linear`; stage.appendChild(s);
        requestAnimationFrame(()=>requestAnimationFrame(()=>{ s.style.left=to.x+"%"; s.style.top=to.y+"%"; }));
        setTimeout(()=>{ s.remove(); res(); },ms); });
    const nearestWhite=p=>{ let b=0,bd=1e9; wpos.forEach((w,i)=>{ const d=(w.x-p.x)**2+(w.y-p.y)**2; if(d<bd){bd=d;b=i;} }); return wpos[b]; };
    const burn=(i)=>{ const p=rooksAt[i], e=$("r"+i); e.classList.add("burnt"); flame(p.x,p.y);
        burst(p.x,p.y,["#57534e","#292524","#f97316","#78716c"],8,34); Music.sfx("fire"); };

    // narrator: shows the line and reads it out loud; resolves when finished
    const say=async(t,opts)=>{ if(skipped) return; const c=$("cap"); c.style.opacity=0; await wait(300); if(skipped) return;
      c.innerHTML=[...t].map((ch,i)=>`<span style="animation-delay:${i*45}ms">${ch===" "?"&nbsp;":esc(ch)}</span>`).join("");
      c.classList.toggle("big",t==="THE ROOK."); c.style.opacity=1; await Music.say(t,opts); };
    const hideCap=()=>{ $("cap").style.opacity=0; };
    (async()=>{
      Music.preloadCine();
      $("cap").textContent="Put your mouse in the box to begin"; $("cap").style.opacity=1;
      await gate(); if(skipped) return;
      $("cap").style.opacity=0; el.querySelector(".skip").style.display="none";   // clicks now end it anyway
      guard(); guardT0=Date.now();
      const song=await Music.cine("build");
      if(!song) Music.play("battle");                 // no song? use the synth soundtrack
      await wait(700);
      await say("In a world where every Rook stood together…"); if(skipped) return;
      // the White army marches in, firing
      const line=say("The White army came for them.");
      whites.forEach((w,i)=>{ const p=at(w.a,54); wpos[i]=p; const e=$("w"+i); e.style.left=p.x+"%"; e.style.top=p.y+"%"; });
      for(let k=0;k<14&&!skipped;k++){ const i=rand(0,whites.length-1), j=rand(0,rooksAt.length-1);
        shot(at(whites[i].a,62),{x:rooksAt[j].x+(Math.random()*8-4),y:rooksAt[j].y+(Math.random()*8-4)},300); await wait(160); }
      await line; if(skipped) return;
      await say("They were surrounded."); if(skipped) return;
      // burn ring by ring, outside -> in
      const DUR={Common:2600,Uncommon:1400,Rare:1400,Epic:1500,Chroma:1100,Legendary:2200};
      let pending=null;
      for(let gi=0;gi<groups.length&&!skipped;gi++){
        const rar=R[groups[gi][0]][1]; Music.level(gi);
        if(rar==="Unique") break;
        if(gi===0) pending=say("One by one… they fell.");
        if(rar==="Legendary"){ if(pending) await pending; pending=say("Not even the legends survived."); }
        const idx=rooksAt.map((p,i)=>p.group===gi?i:-1).filter(i=>i>=0);
        const step=DUR[rar]/idx.length;
        for(const i of idx){ if(skipped) break; shot(nearestWhite(rooksAt[i]),rooksAt[i]).then(()=>{ if(!skipped) burn(i); }); await wait(step); }
        await wait(350);
      }
      if(pending) await pending; if(skipped) return;
      // the Unique burns last — everyone fires at once
      const ui=rooksAt.map((p,i)=>R[p.name][1]==="Unique"?i:-1).filter(i=>i>=0);
      if(ui.length){
        await say("Not even the rarest."); if(skipped) return;
        const target=rooksAt[ui[0]];
        await Promise.all(wpos.map(w=>shot(w,target,650)));
        if(skipped) return;
        ui.forEach(i=>{ $("r"+i).classList.add("burnt"); });
        flame(target.x,target.y,true); flash(.4); shake("shk2"); Music.sfx("bigfire");
        burst(target.x,target.y,["#f97316","#facc15","#111","#fafafa"],26,90);
        await wait(2000);
      }
      if(skipped) return;
      // silence… then the narrator, then the riser
      Music.stop(); Music.cineStop("build",900); hideCap(); await wait(1300); if(skipped) return;
      await say("But they forgot… about one Rook.",{rate:.75,pitch:.45}); if(skipped) return;
      hideCap(); const onBeat=await Music.dropSync(.12); if(skipped) return;   // start the fall 0.12s early so the impact lands on the beat
      // THE ROOK slams into the table
      const t=$("tr"); t.style.transition="top .12s cubic-bezier(.75,0,1,.5),transform .25s"; t.style.opacity=1; t.style.top="50%";
      await wait(120); if(skipped) return;
      Music.sfx(onBeat?"impact":"slam"); flash(.85); shake("shk2");
      t.style.transform="scale(1.2,.8)"; setTimeout(()=>{ t.style.transform="scale(1)"; },220);
      const wv=$("wave"); wv.style.transition="none"; wv.style.opacity=1; void wv.offsetWidth; wv.style.transition="";
      requestAnimationFrame(()=>{ wv.style.transform="scale(7)"; wv.style.opacity=0; });
      burst(50,50,["#3f3f46","#71717a","#a1a1aa","#18181b"],30,140);
      whites.forEach((w,i)=>{ const p=at(w.a,63), e=$("w"+i); e.classList.add("back"); e.style.left=p.x+"%"; e.style.top=p.y+"%"; e.style.transform=`rotate(${rand(-160,160)}deg)`; });
      rooksAt.forEach((p,i)=>{ const e=$("r"+i), dx=(p.x-50)*.06, dy=(p.y-50)*.06; e.style.transform=`scale(.78) translate(${dx}px,${dy+4}px) rotate(${rand(-25,25)}deg)`; });
      await wait(2600); if(skipped) return;
      // shades on…
      t.classList.add("cool"); Music.sfx("shine");
      await wait(1400); if(skipped) return;
      // …and the White army fades away in his aura
      if(!onBeat) Music.sfx("triumph");
      const au=$("aura"); au.style.opacity=1; au.style.transform="scale(5)";
      whites.forEach((w,i)=>$("w"+i).classList.add("gone"));
      await wait(900);
      await say("THE ROOK.",{rate:.6,pitch:.35});
      await wait(2600);
      end();
    })();
  });
}

    <div class="row"><button class="btn red" onclick="for(const k in S.owned)S.owned[k]=1;S.tokens+=${v};save();closeModal();confetti();rooks()">Sell</button><button class="btn" onclick="closeModal()">Cancel</button></div>`); }

// ====================================================================
//  TRADE — real player-to-player trades (Firebase)
// ====================================================================
function addR(n){ S.owned[n]=(S.owned[n]||0)+1; }
function takeR(n){ if(!S.owned[n]) return false; if(--S.owned[n]<=0){ delete S.owned[n]; if(S.equipped===n) S.equipped=Object.keys(S.owned)[0]||"Pebble"; } return true; }
const snap=()=>JSON.parse(JSON.stringify(S));
let MYPREFS={tradeMode:"anyone",allow:[]}, searchT=null;
function trade(give){
  const mine=Object.keys(S.owned);
  app.innerHTML=`<div class="card fade"><h1>🔁 Trade</h1><p class="muted">Send an offer to a player. Your Rook is held until they accept, decline, or you cancel.</p><br>
    <div class="tform">
      <label>🔍 Find a player<div class="tsearch"><input id="t_to" maxlength="15" placeholder="Start typing a name…" autocomplete="off" oninput="findPlayers(this.value)" onblur="setTimeout(()=>{const s=document.getElementById('t_sugg');if(s)s.innerHTML=''},200)"><div class="sugg" id="t_sugg"></div></div></label>
      <label>🔍 You give<input id="t_give" list="dl_mine" placeholder="Search your Rooks…" value="${esc(give&&S.owned[give]?give:"")}" autocomplete="off"></label>
      <label>🔍 You want <span class="small" style="font-weight:400">(leave empty for a 🎁 gift)</span><input id="t_want" list="dl_all" placeholder="Search all Rooks…" autocomplete="off"></label>
      <button class="btn red" id="t_send" onclick="sendOffer()">Send</button>
    </div>
    <datalist id="dl_mine">${mine.map(n=>`<option value="${esc(n)}">${R[n][1]}${S.owned[n]>1?" ×"+S.owned[n]:""}</option>`).join("")}</datalist>
    <datalist id="dl_all">${visibleRooks().map(r=>`<option value="${esc(r[0])}">${r[1]} · ${boxLabel(r[5])}</option>`).join("")}</datalist>
    <div class="prefs" id="prefs"><b>📬 Who can send me trades?</b><span class="muted small">Loading…</span></div>
    <br><div id="tlist"><p class="loading">Loading trades…</p></div></div>`;
  loadPrefs();
  settleTrades().then(renderTrades);
}
function findPlayers(v){
  clearTimeout(searchT); const box=document.getElementById("t_sugg"); v=v.trim();
  if(v.length<1){ box.innerHTML=""; return; }
  searchT=setTimeout(async()=>{
    let list=[]; try{ list=(await FB.searchUsers(v)).filter(u=>u.uid!==UID); }catch(e){}
    if(document.getElementById("t_to").value.trim()!==v) return;
    box.innerHTML=list.length?list.map(u=>`<div onmousedown="t_to.value='${esc(u.name)}';t_sugg.innerHTML=''"><span>👤 ${esc(u.name)}</span><span class="muted small">${u.tradeMode==="none"?"🔒 not trading":u.tradeMode==="some"?"⭐ friends only":"✅ open"}</span></div>`).join(""):`<div class="muted">No players found</div>`;
  },250);
}
async function loadPrefs(){
  try{ const me=await FB.lookup(NAME()); if(me) MYPREFS={tradeMode:me.tradeMode||"anyone",allow:me.allow||[]}; }catch(e){}
  renderPrefs();
}
function renderPrefs(){
  const el=document.getElementById("prefs"); if(!el) return; const m=MYPREFS.tradeMode;
  el.innerHTML=`<b>📬 Who can send me trades?</b>
    <div class="opts">${[["anyone","🌍 Anyone"],["some","⭐ Only these people"],["none","🔒 No one"]].map(([v,l])=>`<label><input type="radio" name="tm" value="${v}" ${m===v?"checked":""} onchange="MYPREFS.tradeMode=this.value;renderPrefs()">${l}</label>`).join("")}</div>
    ${m==="some"?`<input id="p_allow" placeholder="Usernames, separated by commas (e.g. George, Kabir)" value="${esc((MYPREFS.allow||[]).join(", "))}">`:""}
    <div><button class="btn small red" id="p_save" onclick="savePrefs()">Save</button></div>`;
}
async function savePrefs(){
  if(TEST) return toast("🧪 Settings aren't saved in test mode");
  const mode=MYPREFS.tradeMode;
  const allow=mode==="some"?[...new Set((document.getElementById("p_allow").value||"").split(/[,\s]+/).map(s=>s.trim().toLowerCase()).filter(s=>/^[a-z0-9_]{3,15}$/.test(s)))].slice(0,50):[];
  p_save.disabled=true;
  try{ await FB.setTradePrefs(NAME(),mode,allow); MYPREFS={tradeMode:mode,allow}; toast(mode==="none"?"🔒 No one can send you trades now":mode==="some"?`⭐ Only ${allow.length} people can send you trades`:"🌍 Anyone can send you trades","good"); }
  catch(e){ toast("Couldn't save — make sure the newest Firebase rules are published"); }
  renderPrefs();
}
function tradeRow(t,buttons){
  return `<div class="offer"><div class="what">${t.from===UID?`To <b>${esc(t.toName)}</b>: you give`:`<b>${esc(t.fromName)}</b> gives you`}
    ${rookSVG(t.give,40)}<b>${esc(t.give)}</b>${t.want?` for ${rookSVG(t.want,40)}<b>${esc(t.want)}</b>`:" as a 🎁 gift"}</div><div class="row">${buttons}</div></div>`;
}
function renderTrades(){
  const el=document.getElementById("tlist"); if(!el) return;
  const inc=TRADES.filter(t=>t.to===UID&&t.status==="open"), out=TRADES.filter(t=>t.from===UID&&t.status==="open");
  const past=TRADES.filter(t=>t.status!=="open").slice(0,8);
  const word={accepted:"✅ accepted",done:"✅ accepted",declined:"❌ declined",returned:"❌ declined",cancelled:"↩️ cancelled"};
  el.innerHTML=`<h2>📥 Offers for you (${inc.length})</h2>${inc.map(t=>tradeRow(t,`<button class="btn red small" onclick="respond('${t.id}',true)">Accept</button><button class="btn small" onclick="respond('${t.id}',false)">Decline</button>`)).join("")||`<p class="muted">No offers right now.</p>`}
    <h2 style="margin-top:18px">📤 Your offers (${out.length})</h2>${out.map(t=>tradeRow(t,`<span class="muted small">waiting…</span><button class="btn small" onclick="cancelOffer('${t.id}')">Cancel</button>`)).join("")||`<p class="muted">You haven't sent any offers.</p>`}
    ${past.length?`<h2 style="margin-top:18px">🕘 Recent</h2>${past.map(t=>tradeRow(t,`<span class="muted small">${word[t.status]||t.status}</span>`)).join("")}`:""}`;
}
async function sendOffer(){
  if(TEST) return toast("🧪 Trading is off in test mode");
  const to=t_to.value.trim(), give=t_give.value.trim(), want=t_want.value.trim()||null;
  if(!to) return toast("Type a username");
  if(to.toLowerCase()===NAME().toLowerCase()) return toast("You can't trade with yourself 😄");
  if(!S.owned[give]) return toast("Pick a Rook you own to give");
  if(want&&(!R[want]||(want===SECRET&&!S.owned[SECRET]))) return toast(`There's no Rook called "${want}"`);
  t_send.disabled=true;
  let u=null; try{ u=await FB.lookup(to); }catch(e){}
  if(!u){ t_send.disabled=false; return toast(`No player named "${to}"`); }
  const mode=u.tradeMode||"anyone";
  if(mode==="none"||(mode==="some"&&!(u.allow||[]).includes(NAME().toLowerCase()))){ t_send.disabled=false;
    return toast(mode==="none"?`🔒 ${u.name} isn't accepting trades`:`⭐ ${u.name} only accepts trades from certain people`); }
  const before=snap(); takeR(give);
  bump(); try{ await FB.offer(UID,S,{from:UID,fromName:NAME(),fromKey:NAME().toLowerCase(),to:u.uid,toName:u.name,toKey:u.name.toLowerCase(),give,want}); toast(`Offer sent to ${u.name}!`,"good"); }
  catch(e){ S=before; toast(String(e&&e.code).includes("permission")?`${u.name} isn't accepting trades from you`:"Couldn't send — try again"); }
  save(); trade();
}
async function respond(id,accept){
  if(TEST) return toast("🧪 Trading is off in test mode");
  const t=TRADES.find(x=>x.id===id); if(!t) return;
  if(accept&&t.want&&!S.owned[t.want]) return toast(`You need a ${t.want} to accept this`);
  const before=snap();
  if(accept){ addR(t.give); if(t.want) takeR(t.want); }
  bump(); try{ await FB.setTrade(id,accept?"accepted":"declined",UID,S); if(accept){ addStat("trades"); toast(`You got ${t.give}! 🎉`,"good"); confetti(); } else toast("Offer declined"); }
  catch(e){ S=before; toast("Couldn't do that — it may have been cancelled"); }
  save(); trade();
}
async function cancelOffer(id){
  if(TEST) return toast("🧪 Trading is off in test mode");
  const t=TRADES.find(x=>x.id===id); if(!t) return;
  const before=snap(); addR(t.give);
  bump(); try{ await FB.setTrade(id,"cancelled",UID,S); toast(`${t.give} is back in your collection`); }
  catch(e){ S=before; toast("Couldn't cancel — they may have answered already"); }
  save(); trade();
}
async function settleTrades(quiet){
  if(TEST) return;
  if(MODE!=="fb") return;
  try{ TRADES=await FB.trades(UID); }catch(e){ TRADES=[]; return; }
  let changed=false;
  for(const t of TRADES){
    if(t.from!==UID) continue;
    if(t.status==="accepted"||t.status==="declined"){
      const before=snap(), ok=t.status==="accepted";
      if(ok){ if(t.want) addR(t.want); addStat("trades"); } else addR(t.give);
      bump(); try{ await FB.setTrade(t.id,ok?"done":"returned",UID,S); t.status=ok?"done":"returned"; changed=true;
        toast(ok?`${t.toName} accepted your trade!${t.want?" You got "+t.want+" 🎉":""}`:`${t.toName} declined — ${t.give} is back`,ok?"good":""); }
      catch(e){ S=before; }
    }
  }
  if(changed) save();
  const inc=TRADES.filter(t=>t.to===UID&&t.status==="open").length;
  if(quiet&&inc) toast(`📥 You have ${inc} trade offer${inc>1?"s":""}!`);
}

async function createLive(i){
  const s=allSets()[i], mode=document.querySelector('input[name=lm]:checked').value, mins=+lmins.value;
  lgo.disabled=true;
  try{
    let code=null;
    for(let t=0;t<6;t++){ const c=String(rand(100000,999999)); if(!(await FB.getGame(c))){ code=c; break; } }
    if(!code) throw new Error("no code");
    await FB.createGame(code,{host:UID,hostName:NAME(),mode,mins:mode==="race"?0:mins,status:"lobby",created:Date.now(),
      set:{title:s.title,emoji:s.emoji||"📘",cat:s.cat,qs:s.qs.map(x=>({q:x.q,a:[...x.a],c:x.c&&x.c.length?[...x.c]:[0]}))}});
    closeModal(); hostLobby(code);
  }catch(e){ console.error(e); lgo.disabled=false; toast(e&&e.code&&e.code.includes("permission")?"Your account isn't marked as a teacher in Firebase yet":"Couldn't create the game — try again"); }
}
function hostLobby(code){
  leaveLive(); stopTimers();
  LIVE={code,role:"host",unsubs:[],game:null,players:[],ended:false};
  app.innerHTML=`<div class="loading">Setting up game…</div>`;
  LIVE.unsubs.push(FB.watchGame(code,g=>{ if(!LIVE||LIVE.code!==code) return; const was=LIVE.game&&LIVE.game.status; LIVE.game=g; if(g&&g.status==="playing"&&was!=="playing") startHostClock(); renderHost(); }));

const liveKey=g=>g&&g.mode==="race"?"pos":"score";
const sortP=(ps,g)=>[...ps].sort((a,b)=>(b[liveKey(g)]||0)-(a[liveKey(g)]||0)||(b.correct||0)-(a.correct||0));
const unitFor=g=>g.mode==="race"?"🏁":g.mode==="quest"?"💰":"⚡";
const fmtScore=(p,g)=>g.mode==="race"?Math.min(p.pos||0,100)+"%":(p.score||0).toLocaleString();
function renderHost(){

      ${g.mode==="race"?`<div class="track">${sorted.map(p=>`<div class="lane"><span class="lname">${esc(p.name)}</span><div class="runner" style="left:${Math.min(p.pos||0,100)*.86}%">${rookSVG(p.rook,40)}</div><span class="flag">🏁</span></div>`).join("")}</div>`
      :`<div class="lb">${sorted.map((p,i)=>`<div><b>#${i+1}</b><span class="pl">${rookSVG(p.rook,34)}${esc(p.name)}</span><span class="muted small">${p.correct||0}/${p.total||0} right</span><span>${unitFor(g)} ${fmtScore(p,g)}</span></div>`).join("")}</div>`}</div>`;
  } else {
    stopTimers(); if(!LIVE.confetti){ Music.stop(); Music.sfx("win"); }
    app.innerHTML=`<div class="card fade" style="text-align:center"><h1>🏆 Final Results</h1><p class="muted">${esc(g.set.title)} · ${m.name} · ${ps.length} players</p>
