function clockText(endsAt){ const s=Math.max(0,Math.ceil(((endsAt||0)-Date.now())/1000)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function startHostClock(){
  stopTimers();
  gTimer=setInterval(()=>{ if(!LIVE||!LIVE.game) return; const g=LIVE.game; const el=document.getElementById("hclock"); if(el) el.textContent=clockText(g.endsAt);
    if(g.mode!=="race"&&g.endsAt&&Date.now()>=g.endsAt) endLive(); },500);
}
function checkRaceEnd(){ const g=LIVE&&LIVE.game; if(g&&g.mode==="race"&&g.status==="playing"&&LIVE.players.some(p=>(p.pos||0)>=100)) endLive(); }
async function startLive(){ const g=LIVE.game; Music.play("game"); try{ await FB.updateGame(LIVE.code,{status:"playing",started:Date.now(),endsAt:g.mode==="race"?0:Date.now()+g.mins*60000}); }catch(e){ toast("Couldn't start — try again"); } }
async function endLive(cancel){ if(!LIVE||LIVE.ended) return; LIVE.ended=true; try{ await FB.updateGame(LIVE.code,{status:"ended",ended:Date.now()}); }catch(e){ LIVE.ended=false; toast("Couldn't end — try again"); return; } if(cancel) go("host"); }
function podium(sorted,g){
  const top=sorted.slice(0,3); if(!top.length) return "";
  const order=[top[1],top[0],top[2]], h=[90,130,65], col=["#9ca3af","#f59e0b","#b45309"], lbl=["2","1","3"];
  return `<div class="podium">${order.map((p,i)=>p?`<div class="pop" style="animation-delay:${[.2,.4,0][i]}s">${rookSVG(p.rook,70,"bob")}<div>${esc(p.name)}</div><div class="muted small">${unitFor(g)} ${fmtScore(p,g)}</div><div class="step" style="height:${h[i]}px;background:${col[i]}">${lbl[i]}</div></div>`:"").join("")}</div>`;
}
function resultsList(sorted,g,me){
  return `<div class="lb">${sorted.slice(0,15).map((p,i)=>`<div class="${p.id===me?"me":""}"><b>#${i+1}</b><span class="pl">${rookSVG(p.rook,30)}${esc(p.name)}</span><span class="muted small">${p.correct||0}/${p.total||0} right</span><span>${unitFor(g)} ${fmtScore(p,g)}</span></div>`).join("")}</div>`;
}

// ---------- student ----------
function join(){
  app.innerHTML=`<div class="card fade" style="text-align:center;max-width:560px;margin:auto"><div style="font-size:60px">🔑</div><h1>Join a Game</h1>
    <p class="muted">Type the 6-digit code on your teacher's screen.</p><br>
    <form class="joinbox" onsubmit="event.preventDefault();joinCode(jc.value)"><input id="jc" inputmode="numeric" maxlength="6" placeholder="123456" autofocus><button class="btn red big">Join</button></form></div>`;
}
async function joinCode(code){
  code=String(code||"").replace(/\D/g,"");
  if(code.length!==6) return toast("Game codes have 6 numbers");
  let g=null; try{ g=await FB.getGame(code); }catch(e){}
  if(!g) return toast("No game with that code 🤔");
  if(g.status==="ended") return toast("That game is already over");
  if(g.host===UID) return hostLobby(code);
  try{ await FB.joinGame(code,UID,{name:NAME(),title:S.title||"",rook:S.equipped,score:0,correct:0,total:0,pos:0,joined:Date.now()}); }
  catch(e){ return toast("Couldn't join — try again"); }
  studentLive(code,g);
}
function studentLive(code,g){
  leaveLive(); stopTimers(); G=null;
  LIVE={code,role:"student",unsubs:[],game:g,started:false,done:false,seen:{}};
  LIVE.unsubs.push(FB.watchGame(code,ng=>{
    if(!LIVE||LIVE.code!==code) return;
    if(!ng){ toast("The game was removed"); return go("home"); }
    LIVE.game=ng;
    if(ng.status==="playing"&&!LIVE.started) liveStart();
    if(ng.status==="ended"&&!LIVE.done) liveFinish();
  }));
  LIVE.unsubs.push(FB.watchEvents(code,UID,ev=>{
    if(!LIVE||LIVE.seen[ev.id]||!G) return; LIVE.seen[ev.id]=1;
    if(ev.type==="steal"){ const amt=Math.min(ev.amount,G.gold); G.gold-=amt; pushLive(); toast(`😱 ${ev.fromName} stole ${amt} gold from you!`); const el=document.getElementById("mygold"); if(el) el.textContent=G.gold; }
  }));
  if(g.status==="lobby") waitScreen();
  else if(g.status==="playing") liveStart();
}
function waitScreen(){
  const g=LIVE.game, m=LIVE_MODES.find(x=>x.id===g.mode);
  app.innerHTML=`<div class="card fade" style="text-align:center"><h1>You're in! 🎉</h1>
    <div class="bob">${rookSVG(S.equipped,130)}</div>
    <h2>${esc(NAME())}</h2><p class="muted">${esc(g.set.emoji)} ${esc(g.set.title)} · ${m.ic} ${m.name} · hosted by ${esc(g.hostName)}</p>
    <p style="margin-top:14px;font-size:20px">Waiting for your teacher to start… <span class="bob">⏳</span></p>
    <br><button class="btn" onclick="go('home')">Leave game</button></div>`;
}
function liveStart(){
  if(!LIVE||LIVE.started) return;
  const g=LIVE.game; LIVE.started=true; Music.play("game");
  G={set:g.set,mode:g.mode,live:true,deck:[],n:0,gold:0,pts:0,pos:0,correct:0,total:0,streak:0,bots:[]};
  if(g.mode!=="race"){
    gTimer=setInterval(()=>{ if(!LIVE||!G) return; const el=document.getElementById("gclock"); if(el) el.textContent=clockText(LIVE.game.endsAt);
      if(LIVE.game.endsAt&&Date.now()>=LIVE.game.endsAt+1500&&!G.over){ G.over=true; timesUp(); } },400);
  }
  liveNext();
}
function liveScore(){ return G.mode==="classic"?G.pts:G.mode==="quest"?G.gold:G.pos; }
function pushLive(){
  if(!LIVE||LIVE.role!=="student"||!G) return;
  FB.updatePlayer(LIVE.code,UID,{score:G.mode==="classic"?G.pts:G.gold,pos:G.pos,correct:G.correct,total:G.total,rook:S.equipped})
    .catch(e=>{ if(LIVE&&!LIVE.done&&String(e&&e.code).includes("not-found")){ toast("You were removed from the game"); go("home"); } });
}
function liveHud(){
  const g=LIVE.game;
  if(g.mode==="race") return `<div class="hud"><div class="me">${rookSVG(S.equipped,46)} ${esc(NAME())}</div><div>🏁 ${Math.min(G.pos,100)}%</div><div>✅ ${G.correct}</div></div><div class="prog"><div style="width:${Math.min(G.pos,100)}%"></div></div>`;
  return hud(`⏱️ <span id="gclock">${clockText(g.endsAt)}</span>`,g.mode==="quest"?`💰 <span id="mygold">${G.gold}</span>`:`⚡ ${G.pts.toLocaleString()}`);
}
function liveNext(){
  if(!LIVE||!G||G.over||LIVE.done) return;
  if(G.mode==="race"&&G.pos>=100){ app.innerHTML=`<div class="card fade" style="text-align:center"><h1>🏁 You finished!</h1><div class="bob">${rookSVG(S.equipped,120)}</div><p>Waiting for results…</p></div>`; return; }
  ask(liveHud(),20,800,(right,t)=>{
    if(!G||G.over) return;
    G.total++;
    if(G.mode==="classic"){ if(right){ G.correct++; const got=Math.max(500,Math.round(1000-t*25)); G.pts+=got; toast(`+${got}`,"good"); } pushLive(); liveNext(); }
    else if(G.mode==="race"){ if(right){ G.correct++; G.pos+=8+Math.max(0,Math.round(6-t/1.5)); } pushLive(); liveNext(); }
    else { if(right){ G.correct++; pushLive();
        app.innerHTML=`<div class="fade">${liveHud()}<div class="feedback">✅ Correct! Pick a chest</div><div class="chests">${[0,1,2].map(()=>`<div class="chest" onclick="liveChest()">🎁</div>`).join("")}</div></div>`;
      } else { pushLive(); liveNext(); } }
  });
}
async function liveChest(){
  if(!G||G.chestOpen) return; G.chestOpen=true;
  const r=Math.random(); let msg, good=true;
  if(r<.45){ const n=[10,15,20,25,30,40][rand(0,5)]; G.gold+=n; msg=`+${n} gold!`; }
  else if(r<.57){ G.gold*=2; msg="DOUBLE gold! ✖️2"; }
  else if(r<.67){ G.gold=Math.floor(G.gold*1.5)+5; msg="Gold Rush! +50%"; }
  else if(r<.79){ const lost=Math.floor(G.gold*.25); G.gold-=lost; msg=`Oh no! Lost ${lost} gold`; good=false; }
  else if(r<.93){ return liveSteal(); }
  else { msg="Nothing… just a bone 🦴"; good=false; }
  pushLive();
  showModal(`<div style="font-size:60px">${good?"🤑":"😬"}</div><h2>${msg}</h2><p style="font-size:22px;margin:10px 0">💰 ${G.gold}</p><button class="btn red" onclick="closeModal();G.chestOpen=false;liveNext()">Next ▶</button>`);
}
async function liveSteal(){
  showModal(`<h2>😈 STEAL!</h2><p class="muted">Loading players…</p>`);
  let ps=[]; try{ ps=(await FB.getPlayers(LIVE.code)).filter(p=>p.id!==UID); }catch(e){}
  if(!ps.length){ G.gold+=20; pushLive(); return showModal(`<h2>No one to steal from!</h2><p>Have 20 gold instead.</p><button class="btn red" onclick="closeModal();G.chestOpen=false;liveNext()">Next ▶</button>`); }
  ps.sort((a,b)=>(b.score||0)-(a.score||0));
  showModal(`<h2>😈 Steal 20% from…</h2><div class="lb">${ps.slice(0,8).map(p=>`<div style="cursor:pointer;grid-template-columns:1fr auto" onclick="doSteal('${p.id}','${esc(p.name).replace(/'/g,"")}',${p.score||0})"><span class="pl">${rookSVG(p.rook,30)}${esc(p.name)}</span><span>💰 ${p.score||0}</span></div>`).join("")}</div>`);
}
async function doSteal(id,name,gold){
  const amt=Math.floor(gold*.2); G.gold+=amt; pushLive();
  if(amt>0) FB.sendEvent(LIVE.code,{type:"steal",from:UID,fromName:NAME(),to:id,amount:amt,at:Date.now()}).catch(()=>{});
  showModal(`<div style="font-size:60px">😈</div><h2>You stole ${amt} gold from ${esc(name)}!</h2><p style="font-size:22px;margin:10px 0">💰 ${G.gold}</p><button class="btn red" onclick="closeModal();G.chestOpen=false;liveNext()">Next ▶</button>`);
}
function timesUp(){ G.locked=true; closeModal(); app.innerHTML=`<div class="card fade" style="text-align:center"><h1>⏰ Time's up!</h1><div class="bob">${rookSVG(S.equipped,110)}</div><p>Getting results…</p></div>`;
  setTimeout(()=>{ if(LIVE&&!LIVE.done) liveFinish(); },8000); }
async function liveFinish(){
  if(!LIVE||LIVE.done) return; LIVE.done=true; stopTimers(); closeModal(); Music.stop(); Music.sfx("win");
  if(G){ G.over=true; G.locked=true; }
  const g=LIVE.game, code=LIVE.code;
  if(G) await FB.updatePlayer(code,UID,{score:G.mode==="classic"?G.pts:G.gold,pos:G.pos,correct:G.correct,total:G.total}).catch(()=>{});
  app.innerHTML=`<div class="loading">Getting results… 🏆</div>`;
  await new Promise(r=>setTimeout(r,1500));
  let ps=[]; try{ ps=await FB.getPlayers(code); }catch(e){}
  const sorted=sortP(ps,g), place=sorted.findIndex(p=>p.id===UID)+1, correct=G?G.correct:0;
  const earned=reward(correct,g.set);
  if(G&&G.total){ addStat("games"); addStat("correct",correct); if(place===1&&sorted.length>1) addStat("wins"); S.tokens+=earned; save(); }
  if(place===1&&sorted.length>1) confetti();
  app.innerHTML=`<div class="card fade" style="text-align:center"><h1>${place===1?"🏆 You Win!":place&&place<=3?"🎉 Top 3!":"Game Over"}</h1>
    <p>You placed <b>#${place||"?"}</b> of ${sorted.length} · ${correct} right</p>
    ${podium(sorted,g)}${resultsList(sorted,g,UID)}
    <h2 class="pop">+${G&&G.total?earned:0} 🪙 tokens</h2>
    <div class="row"><button class="btn red big" onclick="go('join')">Join another</button><button class="btn big" onclick="go('home')">Home</button></div></div>`;
  leaveLive();
}

async function hydratePolls(list){
  for(const el of document.querySelectorAll(".poll[data-poll]")){
    const n=list.find(x=>x.id===el.dataset.poll); if(!n||!n.poll) continue;
    let st={counts:n.poll.options.map(()=>0),mine:null};
    try{ st=await FB.pollState(n.id,UID,n.poll.options.length); }catch(e){}
    renderPoll(el,n,st);
  }
}
function renderPoll(el,n,st){
  const total=st.counts.reduce((a,b)=>a+b,0), closed=!!n.poll.closed, voted=st.mine!==null, showRes=voted||closed||ADMIN, locked=voted||closed;
  el.innerHTML=`${n.poll.options.map((o,i)=>{ const c=st.counts[i]||0, pct=total?Math.round(c/total*100):0, mine=st.mine===i;
    return showRes
      ?`<button class="popt res ${mine?"mine":""}" ${locked?"disabled":""} onclick="castVote('${n.id}',${i})"><span class="pbar" style="width:${pct}%"></span><span class="ptxt">${mine?"✅ ":""}${esc(o)}</span><span class="ppct">${pct}% · ${c}</span></button>`
      :`<button class="popt" onclick="castVote('${n.id}',${i})"><span class="ptxt">${esc(o)}</span></button>`; }).join("")}
    <p class="muted small">${total} vote${total===1?"":"s"}${closed?" · 🔒 Voting closed":voted?" · ✅ You voted":ADMIN?" · tap a choice to vote":" · tap a choice to vote — you can't change it after"}</p>`;
}
const VOTED={};
async function castVote(id,i){
  const n=(NEWS||[]).find(x=>x.id===id); if(!n||!n.poll||n.poll.closed||VOTED[id]) return;
  const el=document.querySelector(`.poll[data-poll="${id}"]`);
  VOTED[id]=1;
  try{ await FB.vote(id,UID,i); toast("🗳️ Vote counted!","good"); }
  catch(e){ VOTED[id]=0; return toast("Couldn't vote — you may have already voted"); }
  if(el){ try{ renderPoll(el,n,await FB.pollState(id,UID,n.poll.options.length)); }catch(e){} }
}

let draft=null;
const blankQ=()=>({q:"",a:["","","",""],c:[0]});
function toggleC(i,j){ const q=draft.qs[i], c=q.c||[0];
  if(!c.includes(j)&&c.length+1>=q.a.length) return toast("At least one answer has to be wrong");
  q.c=c.includes(j)?c.filter(x=>x!==j):[...c,j]; create(); }
function addAns(i){ if(draft.qs[i].a.length<4){ draft.qs[i].a.push(""); create(); } }
function delAns(i,j){ const q=draft.qs[i]; if(q.a.length<=2) return;
  if(!(q.c||[]).includes(j)&&q.a.length-1-(q.c||[]).length<1) return toast("You can't delete the only wrong answer"); q.a.splice(j,1); q.c=(q.c||[0]).filter(x=>x!==j).map(x=>x>j?x-1:x); create(); }
function create(){
  draft=draft||{title:"",emoji:"📘",cat:"Other",qs:[blankQ()]};
  draft.qs.forEach(q=>{ if(!q.c) q.c=[0]; });
  app.innerHTML=`<div class="card fade"><h1>✏️ Create a Set</h1>
  <div style="display:grid;grid-template-columns:70px 1fr 170px;gap:8px;margin-bottom:12px">
    <input value="${esc(draft.emoji)}" oninput="draft.emoji=this.value" maxlength="2" title="Emoji">
    <input placeholder="Set title" value="${esc(draft.title)}" oninput="draft.title=this.value" maxlength="40">
    <select onchange="draft.cat=this.value">${CATS.map(c=>`<option ${draft.cat===c.name?"selected":""}>${c.name}</option>`).join("")}</select></div>
  ${draft.qs.map((q,i)=>`<div class="qedit"><b>Question ${i+1}</b>
    <input placeholder="Question" value="${esc(q.q)}" oninput="draft.qs[${i}].q=this.value" maxlength="150">
    <div class="opts">${q.a.map((o,j)=>{ const ok=q.c.includes(j); return `<div class="aopt ${ok?"ok":""}"><button class="tick" title="Mark as a correct answer" onclick="toggleC(${i},${j})">${ok?"✅":"⬜"}</button>
      <input placeholder="${ok?"Correct answer":"Wrong answer"}" value="${esc(o)}" oninput="draft.qs[${i}].a[${j}]=this.value" maxlength="60">${q.a.length>2?`<button class="x" title="Remove this answer" onclick="delAns(${i},${j})">✕</button>`:""}</div>`; }).join("")}</div>
    <div class="row" style="justify-content:flex-start;gap:8px">${q.a.length<4?`<button class="btn small" onclick="addAns(${i})">+ Answer</button>`:""}<span class="muted small">Tap ⬜ to mark more than one correct answer · 2–4 answers · at least one must be wrong</span></div>
    ${draft.qs.length>1?`<button class="btn small" style="justify-self:start" onclick="draft.qs.splice(${i},1);create()">Remove</button>`:""}</div>`).join("")}
  <div class="row" style="justify-content:flex-start"><button class="btn" onclick="draft.qs.push(blankQ());create()">+ Add Question</button><button class="btn" onclick="draft.qs.push({q:'',a:['True','False'],c:[0]});create()">+ True / False</button>
  <button class="btn red" onclick="saveSet()">💾 Save Set</button></div>
  ${S.sets.length?`<h2 style="margin-top:22px">Your Sets</h2>${S.sets.map((s,i)=>`<div class="mine-set"><b>${esc(s.emoji)} ${esc(s.title)} <span class="muted small">${esc(s.cat)} · ${s.qs.length} Qs</span></b>
    <div class="row">${TEACHER?`<button class="btn red small" onclick="hostSetup(${BUILTIN.length+i})">🎤 Host</button>`:""}<button class="btn small" onclick="chooseMode(${BUILTIN.length+i})">▶ Play</button><button class="btn small" onclick="delSet(${i})">Delete</button></div></div>`).join("")}`:""}</div>`;
}
function saveSet(){
  const qs=draft.qs.filter(q=>q.q.trim()&&q.a.length>=2&&q.a.every(o=>o.trim())&&(q.c||[]).length&&q.c.length<q.a.length).map(q=>({q:q.q.trim(),a:q.a.map(o=>o.trim()),c:[...q.c].sort()}));
  if(!draft.title.trim()||!qs.length) return showModal(`<h2>Almost!</h2><p>Add a title and at least one question with every answer filled in and at least one ✅ correct answer.</p><br><button class="btn red" onclick="closeModal()">OK</button>`);
  if(qs.length<draft.qs.length) toast(`Skipped ${draft.qs.length-qs.length} unfinished question(s)`);
  S.sets.push({title:draft.title.trim(),emoji:draft.emoji||"📘",cat:draft.cat,qs}); addStat("sets"); draft=null; save(); toast("Set saved! 🎉","good"); create();
}
function delSet(i){ showModal(`<h2>Delete "${esc(S.sets[i].title)}"?</h2><br><div class="row"><button class="btn red" onclick="S.sets.splice(${i},1);save();closeModal();create()">Delete</button><button class="btn" onclick="closeModal()">Cancel</button></div>`); }

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function showModal(h){ document.getElementById("modal").innerHTML=`<div class="modal" onclick="if(event.target===this&&!G)closeModal()"><div class="card">${h}</div></div>`; }
function closeModal(){ document.getElementById("modal").innerHTML=""; }
function toast(m,kind){ const t=document.createElement("div"); t.className="toast "+(kind||""); t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2300); }
function confetti(){ const cols=["#e63940","#ffb703","#2a9d8f","#219ebc","#9b5de5","#f77f00","#22c55e"];
